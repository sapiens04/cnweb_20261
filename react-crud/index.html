<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý người dùng - React CRUD</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
      margin: 0;
      padding: 24px 16px;
    }
    .container {
      max-width: 1150px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 16px; color: #1f4e79; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 5px;
      padding: 7px 14px;
      font-size: 14px;
    }
    .btn-add { background: #2e7d32; color: #fff; }
    .btn-edit { background: #1976d2; color: #fff; margin-right: 6px; }
    .btn-delete { background: #d32f2f; color: #fff; }
    .btn-cancel { background: #9e9e9e; color: #fff; }
    button:hover { opacity: 0.85; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid #e3e3e3; text-align: left; }
    th { background: #1f4e79; color: #fff; }
    tbody tr:nth-child(even) { background: #f7f9fc; }
    tbody tr:hover { background: #eaf2fb; }
    td.actions { white-space: nowrap; }
    .status { padding: 16px; text-align: center; color: #666; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    /* Modal Content */
    .modal-content {
      background: #fff;
      padding: 18px 20px;
      border-radius: 6px;
      width: 340px;
      max-width: calc(100% - 32px);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-content h4 { margin: 0 0 12px; color: #1f4e79; }
    .form-row { display: flex; flex-direction: column; margin-bottom: 10px; }
    .form-row label { font-size: 13px; margin-bottom: 3px; color: #444; }
    .form-row input {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Danh sách trường của form (dùng chung cho Thêm và Sửa)
    const FIELDS = [
      { id: "name", label: "Name" },
      { id: "username", label: "Username" },
      { id: "email", label: "Email" },
      { id: "street", label: "Street" },
      { id: "suite", label: "Suite" },
      { id: "city", label: "City" },
      { id: "phone", label: "Phone" },
      { id: "website", label: "Website" },
    ];
    const ADDRESS_FIELDS = ["street", "suite", "city"];

    const emptyUser = () => ({
      name: "", username: "", email: "",
      address: { street: "", suite: "", city: "" },
      phone: "", website: "",
    });

    // Lấy giá trị một trường (kể cả trường lồng trong address)
    const getFieldValue = (user, id) =>
      ADDRESS_FIELDS.includes(id) ? user.address[id] : user[id];

    // ===================== App =====================
    function App() {
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);

      return (
        <div className="container">
          <h1>Quản lý người dùng</h1>
          <div className="toolbar">
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
          </div>
          <ResultTable
            keyword={kw}
            user={newUser}
            onAdded={() => setNewUser(null)}
          />
        </div>
      );
    }

    // ===================== SearchForm =====================
    function SearchForm({ onChangeValue }) {
      return (
        <input
          className="search-input"
          type="text"
          placeholder="Tìm theo name, username"
          onChange={(e) => onChangeValue(e.target.value)}
        />
      );
    }

    // ===================== AddUser =====================
    function AddUser({ onAdd }) {
      const [adding, setAdding] = React.useState(false);
      const [user, setUser] = React.useState(emptyUser());

      const handleChange = (e) => {
        const { id, value } = e.target;
        if (ADDRESS_FIELDS.includes(id)) {
          setUser({ ...user, address: { ...user.address, [id]: value } });
        } else {
          setUser({ ...user, [id]: value });
        }
      };

      const handleAdd = () => {
        if (user.name.trim() === "" || user.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        onAdd(user);
        setUser(emptyUser());
        setAdding(false);
      };

      const handleCancel = () => {
        setUser(emptyUser());
        setAdding(false);
      };

      return (
        <div>
          <button className="btn-add" onClick={() => setAdding(true)}>Thêm</button>
          {adding && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h4>Thêm người dùng</h4>
                {FIELDS.map((f) => (
                  <div className="form-row" key={f.id}>
                    <label htmlFor={f.id}>{f.label}:</label>
                    <input
                      id={f.id}
                      type="text"
                      value={getFieldValue(user, f.id)}
                      onChange={handleChange}
                    />
                  </div>
                ))}
                <div className="modal-actions">
                  <button className="btn-add" onClick={handleAdd}>Thêm</button>
                  {/* Sửa lỗi đề mẫu: onClick={setAdding(false)} gây "Too many re-renders" */}
                  <button className="btn-cancel" onClick={handleCancel}>Hủy</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ===================== ResultTable =====================
    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      const [editing, setEditing] = React.useState(null);

      // Tải dữ liệu 1 lần khi component mount
      React.useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => res.json())
          .then((data) => { setUsers(data); setLoading(false); })
          .catch(() => { setError("Không tải được dữ liệu!"); setLoading(false); });
      }, []);

      // Khi prop user thay đổi -> thêm vào danh sách
      React.useEffect(() => {
        if (user) {
          // Sửa lỗi đề mẫu: id = prev.length + 1 sẽ trùng id sau khi xóa
          setUsers((prev) => {
            const nextId = prev.length ? Math.max(...prev.map((u) => u.id)) + 1 : 1;
            return [...prev, { ...user, id: nextId }];
          });
          onAdded();
        }
      }, [user]);

      // Lọc theo keyword
      const kwLower = keyword.toLowerCase();
      const filteredUsers = users.filter(
        (u) =>
          u.name.toLowerCase().includes(kwLower) ||
          u.username.toLowerCase().includes(kwLower)
      );

      // ---- Sửa ----
      function editUser(u) {
        // Deep copy để form sửa không làm thay đổi dữ liệu gốc trong bảng
        setEditing({ ...u, address: { ...u.address } });
      }

      function handleEditChange(field, value) {
        if (ADDRESS_FIELDS.includes(field)) {
          setEditing({ ...editing, address: { ...editing.address, [field]: value } });
        } else {
          setEditing({ ...editing, [field]: value });
        }
      }

      function saveUser() {
        if (editing.name.trim() === "" || editing.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
        setEditing(null);
      }

      // ---- Xóa ----
      function removeUser(id) {
        setUsers((prev) => prev.filter((u) => u.id !== id));
      }

      if (loading) return <div className="status">Đang tải dữ liệu...</div>;
      if (error) return <div className="status">{error}</div>;

      return (
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>Username</th>
                <th>Email</th>
                <th>Địa chỉ</th>
                <th>Số điện thoại</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              {filteredUsers.map((u) => (
                <tr key={u.id}>
                  <td>{u.id}</td>
                  <td>{u.name}</td>
                  <td>{u.username}</td>
                  <td>{u.email}</td>
                  <td>{[u.address.street, u.address.suite, u.address.city].filter(Boolean).join(", ")}</td>
                  <td>{u.phone}</td>
                  <td className="actions">
                    <button className="btn-edit" onClick={() => editUser(u)}>Sửa</button>
                    <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
                  </td>
                </tr>
              ))}
              {filteredUsers.length === 0 && (
                <tr><td colSpan="7" className="status">Không có người dùng phù hợp</td></tr>
              )}
            </tbody>
          </table>

          {editing && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h4>Sửa người dùng #{editing.id}</h4>
                {FIELDS.map((f) => (
                  <div className="form-row" key={f.id}>
                    <label htmlFor={"edit-" + f.id}>{f.label}:</label>
                    <input
                      id={"edit-" + f.id}
                      type="text"
                      value={getFieldValue(editing, f.id)}
                      onChange={(e) => handleEditChange(f.id, e.target.value)}
                    />
                  </div>
                ))}
                <div className="modal-actions">
                  <button className="btn-edit" onClick={saveUser}>Lưu</button>
                  <button className="btn-cancel" onClick={() => setEditing(null)}>Hủy</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
